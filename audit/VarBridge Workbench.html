<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>VarBridge Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>
:root{
  --ground:#EDEFF3; --surface:#FFFFFF; --surface-2:#F6F7FA;
  --ink:#15181F; --muted:#5C6476; --line:#D8DCE5; --line-strong:#BFC6D2;
  --accent:#8C2F39; --accent-soft:#F3E3E5;
  --ia:#2F5A8A; --ia-bg:#E2EAF4;
  --ux:#8C2F39; --ux-bg:#F3E3E5;
  --std:#8A5A0C; --std-bg:#F6EBD6;
  --shadow:0 1px 2px rgba(21,24,31,.06), 0 8px 24px -12px rgba(21,24,31,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#101319; --surface:#171B23; --surface-2:#1E232D;
    --ink:#E7EAF0; --muted:#98A1B3; --line:#2A303D; --line-strong:#3B4354;
    --accent:#E28A93; --accent-soft:#3A2227;
    --ia:#8DB4E6; --ia-bg:#1B2636;
    --ux:#E28A93; --ux-bg:#3A2227;
    --std:#DDB067; --std-bg:#2C2517;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#101319; --surface:#171B23; --surface-2:#1E232D;
  --ink:#E7EAF0; --muted:#98A1B3; --line:#2A303D; --line-strong:#3B4354;
  --accent:#E28A93; --accent-soft:#3A2227;
  --ia:#8DB4E6; --ia-bg:#1B2636;
  --ux:#E28A93; --ux-bg:#3A2227;
  --std:#DDB067; --std-bg:#2C2517;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
body{margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans","Noto Sans TC","PingFang TC",-apple-system,system-ui,sans-serif;
  font-size:15px; line-height:1.65; -webkit-font-smoothing:antialiased}
.wrap{max-width:1260px; margin:0 auto; padding-block:40px 72px; padding-inline:24px; display:flex; flex-direction:column; gap:28px}
@media (max-width:600px){.wrap{padding-inline:16px}}

.topline{display:flex; align-items:flex-start; justify-content:space-between; gap:16px}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin:0 0 12px}
h1{font-family:"Newsreader","Songti TC",serif; font-weight:500; font-size:clamp(30px,4.6vw,48px); line-height:1.14; letter-spacing:-.01em; margin:0; text-wrap:balance}
.lede{max-width:66ch; color:var(--muted); margin:14px 0 0; font-size:16px}
.lede b{color:var(--ink); font-weight:600}
.lang-switch{display:flex; border:1px solid var(--line); border-radius:3px; overflow:hidden; flex:none}
.lang-switch button{background:transparent; color:var(--muted); border:0; border-right:1px solid var(--line);
  font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.08em; padding:6px 11px; cursor:pointer}
.lang-switch button:last-child{border-right:0}
.lang-switch button.active{background:var(--ink); color:var(--surface)}

/* pain → lens strip */
.pains{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px}
.pain{background:var(--surface); border:1px solid var(--line); border-radius:3px; padding:14px 16px; display:flex; flex-direction:column; gap:6px}
.pain .tag{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.pain h4{margin:0; font-size:14px; font-weight:600}
.pain p{margin:0; font-size:12.5px; color:var(--muted); line-height:1.55}
.pain .arrow{font-size:12.5px; color:var(--ink); border-top:1px dashed var(--line-strong); padding-top:8px; margin-top:2px}
.lens{display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; padding:1px 7px; border-radius:2px; font-weight:500}
.lens.ia{background:var(--ia-bg); color:var(--ia)} .lens.ux{background:var(--ux-bg); color:var(--ux)} .lens.std{background:var(--std-bg); color:var(--std)}
@media (max-width:820px){.pains{grid-template-columns:1fr}}

/* scoreboard */
.scores{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)) auto; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:3px; overflow:hidden}
.score{background:var(--surface); padding:16px 20px}
.score .k{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.score .v{font-family:"Newsreader",serif; font-size:34px; line-height:1.1; margin-top:4px; font-variant-numeric:tabular-nums}
.score .n{font-size:12.5px; color:var(--muted)}
.score.act{display:flex; flex-direction:column; justify-content:center; gap:8px}
.filters{display:flex; gap:6px; flex-wrap:wrap}
.fchip{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; border:1px solid var(--line-strong); background:transparent; color:var(--muted); padding:4px 9px; border-radius:2px; cursor:pointer}
.fchip[aria-pressed="true"].ia{background:var(--ia-bg); color:var(--ia); border-color:var(--ia)}
.fchip[aria-pressed="true"].ux{background:var(--ux-bg); color:var(--ux); border-color:var(--ux)}
.fchip[aria-pressed="true"].std{background:var(--std-bg); color:var(--std); border-color:var(--std)}
@media (max-width:820px){.scores{grid-template-columns:1fr 1fr 1fr} .score.act{grid-column:1/-1}}
@media (max-width:480px){.scores{grid-template-columns:1fr}}

/* console */
.console{display:grid; grid-template-columns:230px minmax(0,1fr) 340px; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:3px; overflow:hidden}
.pane{background:var(--surface); min-width:0}
.pane-h{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); padding:13px 16px 11px; border-bottom:1px solid var(--line)}
.stagebtn{display:block; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line); padding:13px 16px; color:var(--ink); font:inherit; font-size:13.5px; cursor:pointer}
.stagebtn:hover{background:var(--surface-2)}
.stagebtn[aria-current="true"]{background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent)}
.stagebtn .sid{font-family:"IBM Plex Mono",monospace; font-size:10.5px; color:var(--muted); letter-spacing:.04em}
.stagebtn .sn{display:block; margin-top:2px; font-weight:500; line-height:1.4}
.stagebtn .ag{display:flex; flex-wrap:wrap; gap:4px; margin-top:8px}
.agchip{font-family:"IBM Plex Mono",monospace; font-size:9.5px; padding:1px 6px; border:1px solid var(--line-strong); border-radius:2px; color:var(--muted)}
.railnote{padding:14px 16px; font-size:12px; color:var(--muted); line-height:1.55}

.userbox{margin:16px; padding:12px 15px; border-left:2px solid var(--accent); background:var(--accent-soft); border-radius:0 3px 3px 0}
.userbox .k{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); margin-bottom:3px}
.userbox p{margin:0; font-size:13.5px; line-height:1.6}
.stagewrap{padding:0 16px 18px; overflow-x:auto}
.stage{position:relative; margin:0 auto; max-width:580px; min-width:340px}

/* hotspots */
.hs{position:absolute; width:22px; height:22px; border-radius:50%; border:2px solid var(--surface); color:#fff;
  font-family:"IBM Plex Mono",monospace; font-size:11px; font-weight:600; display:grid; place-items:center; cursor:pointer; padding:0;
  transform:translate(-50%,-50%); z-index:5; transition:transform .2s, opacity .2s; box-shadow:0 1px 3px rgba(0,0,0,.25)}
.hs.ia{background:#2F5A8A} .hs.ux{background:#8C2F39} .hs.std{background:#8A5A0C}
.hs.hot{transform:translate(-50%,-50%) scale(1.3)}
.hs.dim{opacity:.12; pointer-events:none}
.outline-hot{outline:2px dashed #8C2F39; outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion: reduce){.hs{transition:none}}

/* annotations pane */
.ann{border-bottom:1px solid var(--line); padding:12px 16px; cursor:default}
.ann:hover,.ann.hot{background:var(--surface-2)}
.ann.dim{opacity:.35}
.ann-h{display:flex; gap:9px; align-items:baseline}
.num{font-family:"IBM Plex Mono",monospace; font-size:11px; color:var(--muted); flex:none; width:14px}
.ann-h p{margin:0; font-size:13px; line-height:1.5; font-weight:500; flex:1}
.ann .meta{display:flex; gap:6px; margin:7px 0 0 23px; flex-wrap:wrap}
.painchip{font-family:"IBM Plex Mono",monospace; font-size:10px; color:var(--muted); border:1px solid var(--line); padding:1px 6px; border-radius:2px}
.ann .why{margin:6px 0 0 23px; font-size:12.2px; color:var(--muted); line-height:1.55}
.trace{border-top:1px solid var(--line); background:var(--surface-2)}
.trace-h{display:flex; justify-content:space-between; align-items:center; padding:11px 16px 9px}
.trace-h span{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}
.trace-h button{background:none; border:1px solid var(--line-strong); color:var(--ink); font:inherit; font-size:11px; padding:3px 9px; border-radius:3px; cursor:pointer}
.trace pre{margin:0; padding:0 16px 16px; font-family:"IBM Plex Mono",monospace; font-size:10.5px; line-height:1.65; color:var(--muted); overflow-x:auto; white-space:pre}
.trace pre b{color:var(--ink); font-weight:500}
@media (max-width:1060px){.console{grid-template-columns:1fr}}

/* ============ mock world (fixed light, reads as a screen) ============ */
.mock{--mk-bg:#FFFFFF; --mk-alt:#F4F5F7; --mk-ink:#1B1D22; --mk-mut:#6E7380; --mk-line:#E3E5EA; --mk-brand:#2D4F7C; --mk-soft:#EAF0F7;
  background:var(--mk-bg); color:var(--mk-ink); border:1px solid var(--line-strong); border-radius:12px; overflow:hidden; box-shadow:var(--shadow); font-size:12px; line-height:1.55}
.mk-top{background:var(--mk-brand); color:#fff; padding:10px 14px; display:flex; align-items:center; gap:10px; justify-content:space-between}
.mk-top .lg{font-weight:600; font-size:13px}
.mk-top .sl{font-size:10.5px; opacity:.85; font-family:"IBM Plex Mono",monospace}
.mk-tabs{display:flex; gap:2px; background:var(--mk-alt); border-bottom:1px solid var(--mk-line); padding:0 8px; overflow-x:auto}
.mk-tab{font-size:11px; padding:7px 10px; color:var(--mk-mut); border-bottom:2px solid transparent; white-space:nowrap}
.mk-tab.on{color:var(--mk-ink); border-bottom-color:var(--mk-brand); font-weight:600}
.mk-body{padding:13px 14px; display:flex; flex-direction:column; gap:11px}
.mk-label{font-size:9.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--mk-mut); font-family:"IBM Plex Mono",monospace}
.mk-meta{font-size:10px; color:var(--mk-mut); font-family:"IBM Plex Mono",monospace}
.mk-foot{border-top:1px solid var(--mk-line); padding:8px 14px; font-size:10px; color:var(--mk-mut); display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap}
.bub{max-width:86%; padding:8px 11px; border-radius:11px; font-size:11.5px}
.bub.u{align-self:flex-end; background:var(--mk-alt)}
.bub.a{align-self:flex-start; background:var(--mk-soft); border:1px solid #D5E0EE}
.who{font-family:"IBM Plex Mono",monospace; font-size:9.5px; color:var(--mk-mut); display:block; margin-bottom:2px}
.mk-card{border:1px solid var(--mk-line); border-radius:8px; padding:10px 11px}
.mk-card h5{margin:0 0 6px; font-size:12px; font-weight:600}
.xw{width:100%; border-collapse:collapse; font-size:11px}
.xw td{padding:5px 4px; border-top:1px solid var(--mk-line); vertical-align:top}
.xw td:nth-child(2){color:var(--mk-mut); width:14px; text-align:center}
.code-i{font-family:"IBM Plex Mono",monospace; font-size:10.5px; background:var(--mk-alt); padding:0 4px; border-radius:3px}
.mk-btns{display:flex; gap:7px; flex-wrap:wrap}
.mk-b{flex:1; text-align:center; padding:7px 8px; border-radius:6px; font-size:11px; font-weight:500; background:var(--mk-brand); color:#fff; border:0; font-family:inherit; cursor:pointer}
.mk-b.sec{background:var(--mk-alt); color:var(--mk-ink)}
.mk-b.q{background:#fff; color:var(--mk-brand); border:1px solid var(--mk-brand)}
.thr{display:flex; gap:6px; flex-wrap:wrap}
.thr span{font-family:"IBM Plex Mono",monospace; font-size:10.5px; border:1px solid var(--mk-line); background:#fff; border-radius:5px; padding:3px 7px}
.thr span b{font-weight:600}
.pill{display:inline-block; font-size:9.5px; font-family:"IBM Plex Mono",monospace; padding:1px 6px; border-radius:9px; background:#FBEFD9; color:#7A4D06}
.pill.ok{background:#E3EFE9; color:#1E6B4B}
.pill.info{background:var(--mk-soft); color:var(--mk-brand)}

/* sheet diff */
.sheetwrap{overflow-x:auto; border:1px solid var(--mk-line); border-radius:6px}
.sheet{border-collapse:collapse; font-size:10.5px; width:100%; min-width:430px}
.sheet th{text-align:left; font-weight:600; font-size:9.5px; background:var(--mk-alt); padding:6px 6px; border-bottom:1px solid var(--mk-line); white-space:nowrap}
.sheet th small{display:block; font-weight:400; color:var(--mk-mut); font-family:"IBM Plex Mono",monospace; font-size:8.5px}
.sheet td{padding:5px 6px; border-bottom:1px solid var(--mk-line); font-family:"IBM Plex Mono",monospace; white-space:nowrap}
.sheet tr:last-child td{border-bottom:0}
.old{color:#A33322; text-decoration:line-through; opacity:.75; margin-right:4px}
.new{color:#1E6B4B}
.flag{background:#FBEFD9}
.req{color:#A33322}

.genes{width:100%; border-collapse:collapse; font-size:10.5px}
.genes th{text-align:left; font-size:9px; color:var(--mk-mut); font-weight:500; text-transform:uppercase; letter-spacing:.06em; padding:4px}
.genes td{padding:4px; border-top:1px solid var(--mk-line); font-variant-numeric:tabular-nums}
.genes td.id{font-family:"IBM Plex Mono",monospace; font-size:9.5px; color:var(--mk-mut)}
.dlog{list-style:none; margin:0; padding:0; font-size:10.5px}
.dlog li{display:flex; gap:8px; padding:4px 0; border-top:1px solid var(--mk-line)}
.dlog li:first-child{border-top:0}
.dlog .by{font-family:"IBM Plex Mono",monospace; font-size:9px; flex:none; width:74px; color:var(--mk-mut)}
.caveat{font-size:10.5px; color:#6B4A0A; background:#FBF3E2; border:1px solid #EFDDB7; border-radius:6px; padding:7px 9px}

/* footer */
.notes{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:22px; border-top:1px solid var(--line); padding-top:24px}
.note h4{margin:0 0 6px; font-size:13.5px; font-weight:600}
.note p{margin:0; font-size:13px; color:var(--muted); line-height:1.6}
.note code{font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink)}
button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---- VarBridge additions ---- */
.pill.no{background:#ECEEF2; color:#5B6272}
.pill.bad{background:#F6E1DE; color:#A33322}
.pill.lic{background:#EDE6F5; color:#5B3E86}
.kv{width:100%; border-collapse:collapse; font-size:11px}
.kv td{padding:5px 4px; border-top:1px solid var(--mk-line); vertical-align:top}
.kv tr:first-child td{border-top:0}
.kv td:first-child{color:var(--mk-mut); width:34%; font-size:10.5px}
.kv .miss{background:#FBF3E2}
.qchips{display:flex; gap:5px; flex-wrap:wrap}
.qchips span{font-size:10.5px; border:1px solid #C9D6E8; background:var(--mk-soft); color:var(--mk-brand); border-radius:12px; padding:2px 9px}
.chk{display:flex; flex-direction:column; gap:3px; font-size:10.5px}
.chk div{display:flex; justify-content:space-between; gap:8px; border-top:1px solid var(--mk-line); padding-top:4px}
.chk div:first-child{border-top:0; padding-top:0}
.vaf{display:inline-flex; align-items:center; gap:5px}
.vaf i{display:inline-block; width:42px; height:5px; background:#E6E9EF; border-radius:3px; position:relative; overflow:hidden}
.vaf i b{position:absolute; inset:0 auto 0 0; background:var(--mk-brand); border-radius:3px}
.sheet tr.sel td{background:var(--mk-soft)}
.xw5 td:first-child{font-family:"IBM Plex Mono",monospace; font-size:10.5px}
.xw5 td:last-child{color:var(--mk-mut); font-size:10px; text-align:right}
.srcx td{white-space:normal; font-family:inherit; font-size:10.5px; vertical-align:top}
.srcx td.s{font-weight:600; white-space:nowrap}
.srcx td.d{font-family:"IBM Plex Mono",monospace; font-size:9.5px; color:var(--mk-mut); white-space:normal; min-width:62px}
.srcx{min-width:470px}
.legend{display:flex; gap:10px; flex-wrap:wrap; font-size:10px; color:var(--mk-mut)}
.banner{font-size:10.5px; background:#F6E1DE; border:1px solid #EBC3BD; color:#7C2A1F; border-radius:6px; padding:7px 9px}
.sugg{border:1px dashed #9FB3CF; border-radius:8px; padding:9px 10px; background:#F7FAFD}
.tierrow{display:grid; grid-template-columns:minmax(0,1fr) auto auto; gap:6px; align-items:center; font-size:10.8px; padding:6px 0; border-top:1px solid var(--mk-line)}
.tierrow:first-of-type{border-top:0}
.tierrow .g{font-weight:600}
.tierrow .p{font-family:"IBM Plex Mono",monospace; font-size:9.5px; color:var(--mk-mut); display:block; font-weight:400}
.mini{font-size:10px; padding:3px 8px; border-radius:5px; border:1px solid var(--mk-line); background:#fff; color:var(--mk-ink); font-family:inherit; cursor:pointer}
.mini.acc{border-color:#1E6B4B; color:#1E6B4B}
.ovr{font-size:10.5px; background:#FBF3E2; border-left:2px solid #C98A1B; padding:6px 8px; border-radius:0 5px 5px 0}
.report{border:1px solid var(--mk-line); border-radius:8px; padding:10px 11px; font-size:11px; line-height:1.6}
.report h5{margin:0 0 4px; font-size:11.5px}
.report p{margin:0 0 5px}
.report p:last-child{margin:0}

/* ---- page tabs ---- */
[hidden]{display:none!important}
.pagebar{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap}
.owner{font-family:"IBM Plex Mono",monospace; font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:0}
.tabs{display:flex; gap:0; border-bottom:1px solid var(--line-strong); overflow-x:auto}
.tab{background:none; border:0; border-bottom:2px solid transparent; margin-bottom:-1px; padding:10px 18px 11px 0; margin-right:22px;
  font:inherit; color:var(--muted); cursor:pointer; text-align:left; display:flex; flex-direction:column; gap:1px; flex:none}
.tab .tn{font-family:"IBM Plex Mono",monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase}
.tab .tl{font-size:14.5px; font-weight:500}
.tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent)}
.tab[aria-selected="true"] .tn{color:var(--accent)}
.tab:hover{color:var(--ink)}
.panel{display:flex; flex-direction:column; gap:28px}

/* ---- tab 1: study document ---- */
.doc{gap:0; max-width:860px}
.doc-head{display:flex; flex-direction:column; gap:10px; padding-bottom:22px; border-bottom:1px solid var(--line)}
.doc-meta{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
.cover-label{font-family:"IBM Plex Mono",monospace; font-size:11.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--accent)}
.status-badge{font-family:"IBM Plex Mono",monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--std); background:var(--std-bg); padding:2px 8px; border-radius:2px}
.cover-title{font-family:"Newsreader","Songti TC",serif; font-weight:500; font-size:clamp(26px,3.6vw,38px); line-height:1.2; letter-spacing:-.005em; margin:0; text-wrap:balance}
.cover-subtitle{margin:0; color:var(--muted); font-size:16px; max-width:68ch}
.doc-sup{margin:0; font-size:13px; color:var(--ink); border-left:2px solid var(--accent); padding-left:10px}
.exec-box{margin-top:22px; background:var(--surface); border:1px solid var(--line); border-radius:3px; padding:16px 20px}
.exec-box h5{margin:0 0 6px; font-family:"IBM Plex Mono",monospace; font-size:10.5px; font-weight:500; letter-spacing:.12em; text-transform:uppercase; color:var(--muted)}

    "cover.label": "ECSE 542 · Milestone 0 · 專題提案",
    "cover.title": "回看引用紀錄：不同來源呈現方式如何影響使用者查核 AI 回答",
    "cover.subtitle": "本研究比較 AI 研究助理中兩種來源資訊呈現方式：一種是在每個主張旁即時顯示來源摘要的提示框；另一種則是在側邊欄集中列出本次對話使用過的來源，並標示各來源支持哪些主張。",

    "s0.tag": "研究定位",
    "s0.body": "研究採用 Comparative Structured Observation（比較式結構化觀察）方法，目的不是判定哪一種介面「勝出」，而是理解不同呈現方式在何種情境下較能支持使用者查核 AI 回答，並據此提出後續介面設計建議。",

    "s1.title": "研究背景與問題",
    "s1.p1": "AI 研究助理通常會在回答中附上引用，但「有引用」不等於使用者真的會查核。使用者是否願意打開來源、閱讀原文並判斷引用是否真正支持某項主張，與來源資訊在介面中如何呈現有直接關係。",
    "s1.p2": "本研究關注的不是模型答案本身是否正確，而是：<b>當系統提供相同答案與相同來源時，來源資訊的呈現方式會不會改變使用者的查核行為？</b>",
    "s1.p3": "Amershi 等人提出，AI 系統應讓使用者了解系統能力的限制，也應說明系統為何產生某項結果。這兩項要求不能只靠在畫面某處放上一個引用符號來滿足；使用者還需要能夠理解該來源與主張之間的關係。Deng 等人的研究亦指出，歷史紀錄、比較工具等介面支援會影響使用者如何檢視與評估生成式 AI 的輸出。",
    "s1.p4": "因此，本研究想回答的核心問題是：",
    "s1.rq": "當 AI 系統重新呈現其回答所依據的來源紀錄時，不同的呈現方式如何影響使用者查核主張、判斷可信度，以及決定是否採用該回答？",
    "s1.p5": "次要問題是：當使用者決定要不要查核某個主張時，他們在意的是哪些線索，例如主張的重要性、具體程度、來源類型，或是答案看起來是否可疑。",

    "s2.th1": "條件", "s2.th2": "來源呈現方式", "s2.th3": "特點",

    "s2.r2a": "B．提示框組", "s2.r2b": "在個別主張旁顯示短暫的來源提示框", "s2.r2c": "聚焦單一主張、即時但暫時",
    "s2.r3a": "C．清單組", "s2.r3b": "在固定側邊欄列出本次使用的所有來源，並連結到相關主張", "s2.r3c": "提供整體脈絡、可持續查看",
    "s2.p1": "B 與 C 將以低擬真原型實作。為了避免答案內容影響比較結果，三種條件使用的 AI 回答將保持一致：回答會先以 NotebookLM 生成，再在原型中重播。因此，研究中主要改變的是來源資訊的呈現方式，而不是答案內容或模型能力。",

    "s3.title": "研究方法",
    "s3.lead": "本研究採用 Comparative Structured Observation。這是一種用於比較設計概念的質性方法：參與者會在有結構的安排下使用多個設計版本，研究者同時觀察其行為，並在事後訪談中引導他們比較不同版本的經驗。",

    "s3.h1": "參與者",

    "s3.h2": "研究安排",

    "s3.h3": "資料蒐集",
    "s3.p3": "研究者會進行現場觀察，並錄製螢幕與語音。僅依賴訪談不足以判斷使用者實際做了什麼，因此本研究會把操作行為與事後說法分開分析。觀察重點包括：",
    "s3.o1": "參與者是否點開來源或查看原文。",

    "s3.h4": "訪談與分析",
    "s3.p4": "完成三個條件後，參與者會接受半結構式訪談，並比較三種來源呈現方式。訪談將詢問他們偏好的介面、偏好的原因，以及各種呈現方式在哪些情境下較有用。",
    "s3.p5": "分析將採 reflexive thematic analysis。初始編碼會參考 Amershi 等人關於 AI 系統能力說明與決策理由說明的設計原則，以及 Deng 等人提出的使用者檢視與評估生成式 AI 輸出的過程；同時保留開放式編碼，以捕捉研究中出現的新模式。行為次數等描述性資料會作為輔助證據，而不是用來做統計顯著性推論。",

    "s4.title": "預期產出",
    "s4.p1": "本研究的目標不是在提示框與清單之間選出唯一最佳方案，而是整理出一套較完整的來源查核介面設計原則。例如，研究可能發現：",
    "s4.e1": "當使用者需要立即判斷某句話是否可信時，主張旁的來源提示較方便。",

function applyChrome(){
  const d = UI[lang];
  document.querySelectorAll("[data-t]").forEach(el=>{ const v=d[el.dataset.t]; if(v!=null) el.innerHTML=v; });
  const e = ECSE[lang];
  if(typeof V3!=="undefined") document.querySelectorAll("[data-v]").forEach(el=>{ const v=V3[lang][el.dataset.v]; if(v!=null) el.innerHTML=v; });
  document.querySelectorAll("[data-e]").forEach(el=>{ const v=e[el.dataset.e]; if(v!=null) el.innerHTML=v; });
  document.title = d.title; document.documentElement.lang = lang==="zh"?"zh-Hant":"en";
  document.querySelectorAll(".lang-switch button").forEach(b=>b.classList.toggle("active", b.dataset.lang===lang));
  $("pains").innerHTML = d.pains.map(p=>`<div class="pain"><span class="tag">${p.tag}</span><h4>${p.h}</h4><p>${p.p}</p>
    <div class="arrow">→ <span class="lens ${p.lens}">${L(LENS[p.lens])}</span> ${p.a}</div></div>`).join("");
  $("annCount").textContent = TOTAL;
}

function render(){
  $("rail").innerHTML = STAGES.map(s=>`<button type="button" class="stagebtn" data-id="${s.id}" aria-current="${s===active}">
    <span class="sid">${s.sid}</span><span class="sn">${L(s.name)}</span>
    <span class="ag">${s.agents.map(a=>`<span class="agchip">${a}</span>`).join("")}</span></button>`).join("");
  $("rail").querySelectorAll(".stagebtn").forEach(b=>b.onclick=()=>{ active=STAGES.find(s=>s.id===b.dataset.id); render(); });

  $("screenName").textContent = u("screen") + L(active.screen);
  $("userText").textContent = L(active.user);
  stage.innerHTML = SCREENS[active.id]();

  active.ann.forEach((a,i)=>{
    const h=document.createElement("button"); h.type="button";
    h.className="hs "+a.lens+(lensOn[a.lens]?"":" dim"); h.textContent=i+1; h.dataset.i=i;
    h.setAttribute("aria-label", `${i+1}: ${L(a.t)}`);
    h.onmouseenter=()=>hot(i,true); h.onmouseleave=()=>hot(i,false); h.onfocus=()=>hot(i,true); h.onblur=()=>hot(i,false);
    stage.appendChild(h);
  });

  $("annHead").textContent = u("annH") + " · " + active.ann.length;
  annList.innerHTML = active.ann.map((a,i)=>`<div class="ann${lensOn[a.lens]?"":" dim"}" data-i="${i}">
    <div class="ann-h"><span class="num">${i+1}</span><p>${L(a.t)}</p></div>
    <div class="meta"><span class="lens ${a.lens}">${L(LENS[a.lens])}</span><span class="painchip">${L(PAIN[a.pain])}</span></div>
    <p class="why">${L(a.f)}</p></div>`).join("");
  annList.querySelectorAll(".ann").forEach(el=>{ const i=+el.dataset.i; el.onmouseenter=()=>hot(i,true); el.onmouseleave=()=>hot(i,false); });

  const json = JSON.stringify(active.trace,null,2);
  $("traceBody").innerHTML = esc(json).replace(/("needs_human"|"flags"|"checkpoint"|"scope"|"override")/g,"<b>$1</b>");
  $("copyTrace").onclick = e=>{
    const done=()=>{ e.target.textContent=u("copied"); setTimeout(()=>e.target.textContent=u("copy"),1400); };
    try{ navigator.clipboard.writeText(json).then(done).catch(selectTrace); }catch(err){ selectTrace(); }
  };
  requestAnimationFrame(layout);
}
function selectTrace(){ const r=document.createRange(); r.selectNodeContents($("traceBody")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); }

function layout(){
  const sr = stage.getBoundingClientRect();
  stage.querySelectorAll(".hs").forEach(h=>{
    const a = active.ann[+h.dataset.i], el = stage.querySelector(`[data-a="${a.id}"]`);
    if(!el){ h.hidden=true; return; }
    const r = el.getBoundingClientRect();
    const x = Math.min(sr.width-8, Math.max(8, r.right - sr.left - 6));
    const y = Math.max(8, r.top - sr.top + 6);
    h.style.left = x+"px"; h.style.top = y+"px";
  });
}
function hot(i,on){
  const h=stage.querySelector(`.hs[data-i="${i}"]`), c=annList.querySelector(`.ann[data-i="${i}"]`);
  const el=stage.querySelector(`[data-a="${active.ann[i].id}"]`);
  h&&h.classList.toggle("hot",on); c&&c.classList.toggle("hot",on); el&&el.classList.toggle("outline-hot",on);
}

$("filters").addEventListener("click",e=>{ const b=e.target.closest("[data-lens]"); if(!b) return;

document.querySelector(".lang-switch").addEventListener("click",e=>{ const b=e.target.closest("[data-lang]"); if(!b) return;

let active3 = STAGES3[0];
const stage3 = $("stage3"), annList3 = $("annList3");

function render3(){
  $("rail3").innerHTML = STAGES3.map(s=>`<button type="button" class="stagebtn" data-id="${s.id}" aria-current="${s===active3}">
    <span class="sid">${s.sid}</span><span class="sn">${L(s.name)}</span>

  $("screenName3").textContent = v3("screen") + L(active3.screen);
  $("userText3").textContent = L(active3.user);
  stage3.innerHTML = SCREENS3[active3.id]();
  stage3.querySelectorAll(".cl[data-link]").forEach(c=>{
    const p = ()=>$(c.dataset.link);
    c.onmouseenter=()=>{ c.classList.add("lit"); const e=p(); e&&e.classList.add("outline-hot"); };
    c.onmouseleave=()=>{ c.classList.remove("lit"); const e=p(); e&&e.classList.remove("outline-hot"); };
  });
  active3.ann.forEach((a,i)=>{
    const h=document.createElement("button"); h.type="button";
    h.className="hs "+a.lens; h.textContent=i+1; h.dataset.i=i;
    h.setAttribute("aria-label", `${i+1}: ${L(a.t)}`);
    h.onmouseenter=()=>hot3(i,true); h.onmouseleave=()=>hot3(i,false); h.onfocus=()=>hot3(i,true); h.onblur=()=>hot3(i,false);
    stage3.appendChild(h);
  });
  $("annHead3").textContent = v3("annH") + " · " + active3.ann.length;
  annList3.innerHTML = active3.ann.map((a,i)=>`<div class="ann" data-i="${i}">
    <div class="ann-h"><span class="num">${i+1}</span><p>${L(a.t)}</p></div>
    <div class="meta"><span class="lens ${a.lens}">${L(LENS3[a.lens])}</span><span class="vschip">${L(VS3[a.vs])}</span></div>
    <p class="why">${L(a.f)}</p></div>`).join("");
  annList3.querySelectorAll(".ann").forEach(el=>{ const i=+el.dataset.i; el.onmouseenter=()=>hot3(i,true); el.onmouseleave=()=>hot3(i,false); });
  const json = JSON.stringify(active3.trace,null,2);
  $("traceBody3").innerHTML = esc(json).replace(/("observe"|"risk"|"logged_events")/g,"<b>$1</b>");
  $("copyTrace3").onclick = e=>{
    const done=()=>{ e.target.textContent=v3("copied"); setTimeout(()=>e.target.textContent=v3("copy"),1400); };
    const sel=()=>{ const r=document.createRange(); r.selectNodeContents($("traceBody3")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); };
    try{ navigator.clipboard.writeText(json).then(done).catch(sel); }catch(err){ sel(); }
  };
  requestAnimationFrame(layout3);
}
function drawLinks3(){
  const sp=$("split3"), svg=$("links3"); if(!sp||!svg) return;
  const c=sp.getBoundingClientRect();
  svg.setAttribute("viewBox",`0 0 ${c.width} ${c.height}`);
  const seg=(a,b,dash)=>{ const A=$(a).getBoundingClientRect(), B=$(b).getBoundingClientRect();
    const x1=A.right-c.left, y1=A.top+A.height/2-c.top, x2=B.left-c.left, y2=B.top+B.height/2-c.top, m=(x2-x1)/2;
    return `<path d="M${x1},${y1} C${x1+m},${y1} ${x2-m},${y2} ${x2},${y2}" fill="none" stroke="#5B7BA6" stroke-width="1.4" ${dash?'stroke-dasharray="4 3"':''}/><circle cx="${x1}" cy="${y1}" r="2.4" fill="#5B7BA6"/><circle cx="${x2}" cy="${y2}" r="2.4" fill="#5B7BA6"/>`; };
  const o=$("d-c4").getBoundingClientRect(), ox=o.right-c.left, oy=o.top+o.height/2-c.top;
  svg.innerHTML = seg("d-c1","d-p1a",false)+seg("d-c2","d-p1b",true)+seg("d-c3","d-p2a",false)
    + `<line x1="${ox}" y1="${oy}" x2="${ox+16}" y2="${oy}" stroke="#C27A72" stroke-width="1.4" stroke-dasharray="2 2"/><circle cx="${ox+20}" cy="${oy}" r="4" fill="#fff" stroke="#C27A72" stroke-width="1.4"/>`;
}
function layout3(){
  if($("panel-alt").hidden) return;
  drawLinks3();
  const sr = stage3.getBoundingClientRect();
  stage3.querySelectorAll(".hs").forEach(h=>{
    const a = active3.ann[+h.dataset.i], el = stage3.querySelector(`[data-a="${a.id}"]`);
    if(!el){ h.hidden=true; return; }
    const r = el.getBoundingClientRect();
    h.style.left = Math.min(sr.width-8, Math.max(8, r.right - sr.left - 6))+"px";
    h.style.top = Math.max(8, r.top - sr.top + 6)+"px";
  });
}
function hot3(i,on){
  const h=stage3.querySelector(`.hs[data-i="${i}"]`), c=annList3.querySelector(`.ann[data-i="${i}"]`);
  const el=stage3.querySelector(`[data-a="${active3.ann[i].id}"]`);
  h&&h.classList.toggle("hot",on); c&&c.classList.toggle("hot",on); el&&el.classList.toggle("outline-hot",on);
}
new ResizeObserver(()=>layout3()).observe(stage3);
window.addEventListener("resize", layout3);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(layout3);

}
