<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Interface Audit Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F5F2; --panel:#FFFFFF; --panel-2:#F0EEE9; --panel-3:#E7E4DE; --line:#DFDAD2; --line-2:#CFC9BF;
  --ink:#1A1A18; --ink-2:#57534D; --ink-3:#8B857B;
  --accent:#0F6E64; --accent-soft:#E2F1EE; --accent-ink:#0B564E;
  --gap:#B3261E; --gap-soft:#FBE9E7;
  --maj:#8A5A00; --maj-soft:#FBF2DF;
  --ok:#12704A; --ok-soft:#E2F3EA;
  --unk:#6C6A93; --unk-soft:#ECEBF5;
  --stage:#D9D5CD;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121210; --panel:#1A1917; --panel-2:#221F1C; --panel-3:#2B2823; --line:#332F2A; --line-2:#443F38;
  --ink:#F0EDE8; --ink-2:#B0A99F; --ink-3:#807A71;
  --accent:#4FC4B4; --accent-soft:#0E2B28; --accent-ink:#7BD9CB;
  --gap:#F58F86; --gap-soft:#371C19;
  --maj:#E3B25C; --maj-soft:#30260F;
  --ok:#5CD29B; --ok-soft:#112C20;
  --unk:#A7A4CE; --unk-soft:#22203A;
  --stage:#0C0C0B;
}}
:root[data-theme="dark"]{
  --bg:#121210; --panel:#1A1917; --panel-2:#221F1C; --panel-3:#2B2823; --line:#332F2A; --line-2:#443F38;
  --ink:#F0EDE8; --ink-2:#B0A99F; --ink-3:#807A71;
  --accent:#4FC4B4; --accent-soft:#0E2B28; --accent-ink:#7BD9CB;
  --gap:#F58F86; --gap-soft:#371C19;
  --maj:#E3B25C; --maj-soft:#30260F;
  --ok:#5CD29B; --ok-soft:#112C20;
  --unk:#A7A4CE; --unk-soft:#22203A;
  --stage:#0C0C0B;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);
  font-family:'Inter',-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
  font-size:13px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow:hidden}
svg.ic{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;
  stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;display:block}
svg.ic.lg{width:19px;height:19px}
svg.ic.sm{width:13px;height:13px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.mono{font-family:var(--mono)}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ── shell ── */
.app{display:grid;grid-template-columns:46px var(--lw,268px) minmax(0,1fr) var(--rw,320px);height:100%}
.app.lcol{--lw:0px}
.col{min-width:0;display:flex;flex-direction:column;overflow:hidden}
.col.rail{background:var(--panel-2);border-right:1px solid var(--line);align-items:center;padding:10px 0;gap:4px}
.col.left{background:var(--panel);border-right:1px solid var(--line)}
.col.mid{background:var(--bg)}
.col.right{background:var(--panel);border-left:1px solid var(--line)}
.app.lcol .col.left{display:none}

/* rail */
.rbtn{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;color:var(--ink-3)}
.rbtn:hover{background:var(--panel-3);color:var(--ink)}
.rbtn.on{background:var(--accent-soft);color:var(--accent-ink)}
.rbtn.lang{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.04em}
.lang-switch{display:flex;flex-direction:column;gap:2px;margin-bottom:4px}
.lang-switch button{
  width:32px;height:22px;border-radius:6px;font-family:var(--mono);font-size:9.5px;font-weight:600;
  letter-spacing:.04em;color:var(--ink-3)
}
.lang-switch button:hover{background:var(--panel-3);color:var(--ink)}
.lang-switch button.active{background:var(--ink);color:var(--bg)}
.rsp{flex:1}

/* panel headers */
.ph{display:flex;align-items:center;gap:7px;padding:11px 13px;border-bottom:1px solid var(--line);flex:none}
.ph h2{font-size:12px;font-weight:600;letter-spacing:.01em}
.ph .cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.ph .ghost{color:var(--ink-3);display:grid;place-items:center;width:22px;height:22px;border-radius:5px}
.ph .ghost:hover{background:var(--panel-3);color:var(--ink)}
.scroll{overflow-y:auto;flex:1}

/* ── left: session steps ── */
.steps{padding:8px 6px}
.step{display:flex;gap:9px;align-items:flex-start;padding:7px 8px;border-radius:8px;width:100%;text-align:left}
.step:hover{background:var(--panel-2)}
.step .sic{margin-top:1px;color:var(--ink-3)}
.step.done .sic{color:var(--ok)}
.step.run .sic{color:var(--accent)}
.step .st{font-size:12.5px;font-weight:500;line-height:1.4}
.step .ss{font-size:11px;color:var(--ink-3);line-height:1.4;font-family:var(--mono)}
.step.run .st{color:var(--accent-ink)}

.tools{display:flex;gap:6px;padding:9px 12px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.tool{display:flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid var(--line);border-radius:7px;
  color:var(--ink-2);font-size:11.5px}
.tool:hover{border-color:var(--line-2);color:var(--ink)}
.tool.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}

.notes{padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.note{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--panel-2)}
.note .nh{display:flex;gap:6px;align-items:center;font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.note .nh button{margin-left:auto;color:var(--ink-3);display:grid;place-items:center}
.note .nh button:hover{color:var(--gap)}
.note .nsel{font-family:var(--mono);font-size:10.5px;color:var(--accent-ink);word-break:break-all;margin-top:3px}
.note .ntx{font-size:11.5px;color:var(--ink-2);margin-top:4px}
.empty{padding:16px 14px;color:var(--ink-3);font-size:11.5px;text-align:center;line-height:1.7}

.composer{border-top:1px solid var(--line);padding:10px 12px;flex:none}
.cbox{display:flex;gap:7px;align-items:flex-end;border:1px solid var(--line);border-radius:10px;padding:7px 9px;background:var(--panel-2)}
.cbox textarea{flex:1;border:0;background:none;resize:none;font:inherit;font-size:12px;color:var(--ink);
  outline:none;max-height:88px;min-height:19px;line-height:1.5}
.cbox textarea::placeholder{color:var(--ink-3)}
.cbox .send{color:var(--ink-3);display:grid;place-items:center;width:24px;height:24px;border-radius:6px}
.cbox .send:hover{background:var(--panel-3);color:var(--accent-ink)}

/* ── middle ── */
.omni{display:flex;align-items:center;gap:7px;padding:9px 12px;border-bottom:1px solid var(--line);flex:none;background:var(--panel)}
.nav-b{color:var(--ink-3);display:grid;place-items:center;width:26px;height:26px;border-radius:6px}
.nav-b:hover{background:var(--panel-3);color:var(--ink)}
.addr{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:9px;
  padding:5px 10px;background:var(--panel-2);min-width:0}
.addr .modes{display:flex;gap:2px;flex:none}
.mbtn{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;color:var(--ink-3)}
.mbtn:hover{background:var(--panel-3);color:var(--ink)}
.mbtn.on{background:var(--accent);color:var(--panel)}
.addr input{flex:1;border:0;background:none;outline:none;font-family:var(--mono);font-size:11.5px;color:var(--ink);min-width:0}
.addr input::placeholder{color:var(--ink-3)}
.addr select{border:0;background:none;outline:none;font:inherit;font-size:11.5px;color:var(--ink);flex:1;min-width:0}
.go{color:var(--ink-3);display:grid;place-items:center;width:22px;height:22px;border-radius:5px;flex:none}
.go:hover{background:var(--panel-3);color:var(--accent-ink)}

.carriers{display:flex;align-items:center;gap:4px;padding:7px 12px;border-bottom:1px solid var(--line);
  flex:none;background:var(--panel)}
.car{display:flex;align-items:center;gap:6px;padding:5px 9px;border-radius:7px;color:var(--ink-3);border:1px solid transparent}
.car:hover{background:var(--panel-2);color:var(--ink)}
.car.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.car .cdim{font-family:var(--mono);font-size:9.5px;opacity:.7}
.carriers .modechip{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.carriers .modechip button{padding:4px 10px;font-size:11px;color:var(--ink-3)}
.carriers .modechip button.on{background:var(--ink);color:var(--bg)}

.stage{flex:1;overflow:auto;background:var(--stage);display:grid;place-items:center;padding:26px;position:relative}
.frame{position:relative;transform-origin:center center}
.device{background:var(--panel);border:1px solid var(--line-2);border-radius:14px;overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,.10),0 24px 60px -30px rgba(0,0,0,.5)}
.device.ar{border-radius:70px/34px}
.device.hud{border-radius:6px;border-style:dashed}
.device iframe{display:block;border:0;background:var(--panel);width:100%;height:100%}
.ovl{position:absolute;inset:0;pointer-events:none}
.mk{position:absolute;pointer-events:auto;cursor:pointer;transform:translate(-50%,-50%)}
.mk .dot{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
  font-family:var(--mono);font-size:10px;font-weight:600;border:2px solid var(--panel)}
.mk.gap .dot{background:var(--gap);color:#fff}
.mk.maj .dot{background:var(--maj);color:#fff}
.mk.ok .dot{background:var(--ok);color:#fff}
.mk.unk .dot{background:var(--unk);color:#fff}
.mk.sel .dot{box-shadow:0 0 0 4px color-mix(in srgb,currentColor 30%,transparent)}
.box{position:absolute;border:1.5px dashed var(--gap);border-radius:5px;pointer-events:none;
  background:color-mix(in srgb,var(--gap) 7%,transparent)}
.box.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 7%,transparent)}
.box.unk{border-color:var(--unk);background:color-mix(in srgb,var(--unk) 7%,transparent)}
.pin{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;color:var(--accent-ink)}
.stagenote{position:absolute;left:0;right:0;bottom:0;padding:8px 12px;font-size:11px;color:var(--ink-3);
  background:linear-gradient(transparent,rgba(0,0,0,.06));text-align:center;font-family:var(--mono)}
.blocked{max-width:380px;text-align:center;color:var(--ink-2);background:var(--panel);border:1px solid var(--line);
  border-radius:12px;padding:22px 24px}
.blocked h3{font-size:13px;margin-bottom:6px}
.blocked p{font-size:11.5px;color:var(--ink-3);line-height:1.7}

/* ── right: checks ── */
.chk{border-bottom:1px solid var(--line)}
.chk-h{display:flex;gap:9px;align-items:flex-start;padding:10px 12px;width:100%;text-align:left}
.chk-h:hover{background:var(--panel-2)}
.chk.sel .chk-h{background:var(--accent-soft)}
.chk.na{opacity:.42}
.chk-h .num{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:3px;width:12px;flex:none}
.chk-h .stx{flex:1;min-width:0}
.chk-h .nm{font-size:12.5px;font-weight:600;line-height:1.35}
.chk-h .en{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);letter-spacing:.02em}
.chk-h .rt{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;margin-top:1px}
.sevbar{display:flex;gap:2px}
.sevbar i{width:11px;height:3px;border-radius:1px;background:var(--line-2)}
.sevbar i.f{background:var(--gap)}
.sevbar i.f.m{background:var(--maj)}
.sic-gap{color:var(--gap)} .sic-ok{color:var(--ok)} .sic-unk{color:var(--unk)} .sic-na{color:var(--ink-3)}

.chk-b{padding:2px 12px 14px 33px;display:none}
.chk.open .chk-b{display:block}
.fld{margin-top:10px}
.fld .lb{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.fld .vl{font-size:12px;color:var(--ink-2);line-height:1.65}
.fld .vl b{color:var(--ink)}
.verb{background:var(--panel-2);border-left:2px solid var(--line-2);padding:7px 10px;border-radius:0 6px 6px 0;
  font-size:11.5px;color:var(--ink);margin-top:3px}
.verb.claim{border-left-color:var(--accent)}
.verb em{font-style:normal;background:var(--gap-soft);color:var(--gap);padding:0 3px;border-radius:2px;font-weight:600}
.alt{background:var(--unk-soft);border:1px solid var(--unk);border-radius:7px;padding:8px 10px;margin-top:9px;
  font-size:11.5px;color:var(--ink-2)}
.alt .lb{color:var(--unk);font-weight:600;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:3px}
.jump{display:inline-flex;align-items:center;gap:5px;margin-top:10px;padding:4px 9px;border:1px solid var(--line);
  border-radius:6px;font-size:11px;color:var(--ink-2)}
.jump:hover{border-color:var(--accent);color:var(--accent-ink)}

.evi{border-top:1px solid var(--line);background:var(--panel-2);flex:none}
.evi-h{display:flex;align-items:center;gap:7px;padding:9px 12px}
.evi-h span{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.evi-h button{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-3);
  border:1px solid var(--line);border-radius:6px;padding:3px 8px}
.evi-h button:hover{color:var(--accent-ink);border-color:var(--accent)}
.evi pre{margin:0;padding:0 12px 12px;font-family:var(--mono);font-size:10px;line-height:1.6;
  color:var(--ink-3);max-height:168px;overflow:auto;white-space:pre}
.evi pre b{color:var(--ink)}

.legend{display:flex;gap:12px;padding:8px 12px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink-3);flex:none}
.legend div{display:flex;align-items:center;gap:4px}

@media (max-width:1180px){ .app{grid-template-columns:46px minmax(0,1fr) 300px} .col.left{display:none} }
</style>
</head>
<body>
<nav class="side-nav" id="audit-sidebar" aria-label="Audit pages"></nav>
<div class="main-content">
<div class="page-chrome" id="audit-chrome"></div>
<div class="main-body is-app">

<div class="app" id="app">

  <!-- ═════ icon rail ═════ -->
  <div class="col rail">
    <button class="rbtn" id="tgLeft" data-t-title="tgLeft" title="Collapse session"></button>
    <button class="rbtn on" data-t-title="railSess" title="Session"></button>
    <button class="rbtn" data-t-title="railEvi" title="Evidence"></button>
    <button class="rbtn" data-t-title="railSet" title="Settings"></button>
    <div class="rsp"></div>
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" data-lang="en" class="active">EN</button>
      <button type="button" data-lang="zh">繁</button>
    </div>
    <button class="rbtn" id="tgTheme" data-t-title="tgTheme" title="Toggle theme"></button>
  </div>

  <!-- ═════ left ═════ -->
  <div class="col left" id="colLeft">
    <div class="ph"><span id="icSess"></span><h2 data-t="sessH">Session</h2><span class="cnt" id="sessCnt"></span></div>
    <div class="scroll">
      <div class="steps" id="steps"></div>
      <div class="tools">
        <button class="tool" id="tCap"><span></span><span data-t="cap">Capture</span></button>
        <button class="tool" id="tAnn"><span></span><span data-t="ann">Annotate</span></button>
      </div>
      <div class="notes" id="notes"></div>
    </div>
    <div class="composer">
      <div class="cbox">
        <textarea id="inp" rows="1" data-t-ph="inpPh" placeholder="Type an observation or instruction…"></textarea>
        <button class="send" id="send" data-t-title="send" title="Send"></button>
      </div>
    </div>
  </div>

  <!-- ═════ middle ═════ -->
  <div class="col mid">
    <div class="omni">
      <button class="nav-b" data-t-title="navBack" title="Previous"></button>
      <button class="nav-b" data-t-title="navFwd" title="Next"></button>
      <button class="nav-b" id="reload" data-t-title="reload" title="Reload"></button>
      <div class="addr">
        <div class="modes">
          <button class="mbtn on" data-m="sample" data-t-title="mSample" title="Built-in sample"></button>
          <button class="mbtn" data-m="url" data-t-title="mUrl" title="URL (embeddable sites only)"></button>
          <button class="mbtn" data-m="repo" data-t-title="mRepo" title="Public GitHub repo"></button>
          <button class="mbtn" data-m="file" data-t-title="mFile" title="Upload html / mdx"></button>
        </div>
        <select id="selSample"></select>
        <input id="inAddr" hidden>
        <input type="file" id="inFile" accept=".html,.htm,.md,.mdx" hidden>
        <button class="go" id="goBtn" data-t-title="go" title="Load"></button>
      </div>
    </div>

    <div class="carriers" id="carriers"></div>

    <div class="stage" id="stage">
      <div class="frame" id="frame">
        <div class="device" id="device"><iframe id="fr" data-t-title="frTitle" title="Surface under test"></iframe></div>
        <div class="ovl" id="ovl"></div>
      </div>
    </div>
  </div>

  <!-- ═════ right ═════ -->
  <div class="col right">
    <div class="ph"><span id="icAlert"></span><h2 data-t="chkH">Audit results</h2><span class="cnt" id="chkCnt"></span></div>
    <div class="scroll" id="checks"></div>
    <div class="legend" id="legend"></div>
    <div class="evi">
      <div class="evi-h"><span id="icDoc"></span><span data-t="eviH">Evidence record</span>
        <button id="copyEvi"><span></span><span data-t="copy">Copy</span></button></div>
      <pre id="eviBody"></pre>
    </div>
  </div>
</div>

<script>
/* ══════════════ line icons — stroke only, no fill ══════════════ */
const P = d => `<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${d}</svg>`;
const ICON = {
  panel:  P('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>'),
  steps:  P('<path d="M4 6h1M4 12h1M4 18h1M9 6h11M9 12h11M9 18h11"/>'),
  doc:    P('<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>'),
  gear:   P('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M19.1 4.9L17 7M7 17l-2.1 2.1"/>'),
  moon:   P('<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>'),
  back:   P('<path d="M15 5l-7 7 7 7"/>'),
  fwd:    P('<path d="M9 5l7 7-7 7"/>'),
  reload: P('<path d="M20 11a8 8 0 1 0-1.6 5.6"/><path d="M20 5v6h-6"/>'),
  grid:   P('<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>'),
  globe:  P('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 2.5 15.3 0 18M12 3c-2.5 2.7-2.5 15.3 0 18"/>'),
  branch: P('<circle cx="7" cy="5" r="2"/><circle cx="7" cy="19" r="2"/><circle cx="17" cy="9" r="2"/><path d="M7 7v10M17 11v1a4 4 0 0 1-4 4H7"/>'),
  upload: P('<path d="M12 15V4"/><path d="M8 8l4-4 4 4"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>'),
  enter:  P('<path d="M5 12h13"/><path d="M13 7l5 5-5 5"/>'),

function renderSteps(){
  document.getElementById('steps').innerHTML = STEPS.map(([s,title,sub],i)=>{
    const ic = s==='done'?'dotD':s==='run'?'dotR':'dotO';
    const cls = s==='done'?'done':s==='run'?'run':'';
    const sb = i===3 ? `${notes.length} notes` : sub;
    return `<button class="step ${cls}"><span class="sic">${ICON[ic]}</span>

  }).join('');

}

function renderCarriers(){
  const el=document.getElementById('carriers');
  el.innerHTML = Object.entries(CARRIERS).map(([k,c])=>
    `<button class="car ${k===carrier?'on':''}" data-c="${k}">${ICON[c.ic]}
      <span>${L(c.label)}</span><span class="cdim">${c.w}×${c.h}</span></button>`).join('')
    + `<div class="modechip"><button class="on">${t('watch')}</button><button>${t('enforce')}</button></div>`;
  el.querySelectorAll('.car').forEach(b=>b.onclick=()=>{carrier=b.dataset.c;renderCarriers();applyCarrier();renderChecks();});

/* ── load / carrier ── */
function applyCarrier(){
  const c=CARRIERS[carrier];
  dev.className='device'+(carrier==='ar'?' ar':carrier==='hud'?' hud':'');
  dev.style.width=c.w+'px'; dev.style.height=c.h+'px';
  const avail=Math.max(240,stage.clientWidth-56), availH=Math.max(200,stage.clientHeight-56);
  const s=Math.max(.34, Math.min(1, avail/c.w, availH/c.h));
  frame.style.transform=`scale(${s})`; frame.dataset.scale=s;
  frame.style.width=c.w+'px'; frame.style.height=c.h+'px';
  ovl.style.width=c.w+'px'; ovl.style.height=c.h+'px';
  setTimeout(drawMarkers,60);
}
function loadSample(){
  const s=SAMPLES[sampleKey];
  fr.removeAttribute('src'); fr.srcdoc=L(s.html);
  fr.onload=()=>{ hookFrame(); drawMarkers(); };
}
function hookFrame(){
  let d; try{ d=fr.contentDocument }catch(e){ return }
  if(!d) return;
  d.addEventListener('click',ev=>{
    if(tool!=='ann'&&tool!=='cap') return;
    ev.preventDefault(); ev.stopPropagation();
    const t=ev.target.closest('[data-a]')||ev.target;
    const selr = t.getAttribute('data-a') ? `[data-a="${t.getAttribute('data-a')}"]`
      : t.tagName.toLowerCase()+(t.className&&typeof t.className==='string'?'.'+t.className.trim().split(/\s+/)[0]:'');
    notes.push({ kind:tool, sample:sampleKey, route:SAMPLES[sampleKey].route, sel:selr,
      verbatim:(t.innerText||'').trim().slice(0,90), x:ev.clientX, y:ev.clientY,
      text: tool==='cap'?t('capNote'):'' });
    renderNotes(); renderSteps(); drawMarkers(); buildEvidence();
  },true);
  try{ fr.contentWindow.addEventListener('scroll',drawMarkers,{passive:true}) }catch(e){}
}

/* ── markers ── */
function applicable(c){ return c.carriers[carrier]||'na' }
function effState(c){ const a=applicable(c); return a==='na'?'na':c.state }
function drawMarkers(){
  ovl.innerHTML='';
  let d; try{ d=fr.contentDocument }catch(e){ return }
  if(!d||!d.body) return;
  CHECKS.forEach((c,i)=>{
    if(c.sample!==sampleKey) return;
    const st=effState(c); if(st==='na') return;
    const el=d.querySelector(c.sel); if(!el) return;
    const r=el.getBoundingClientRect();
    const b=document.createElement('div');
    b.className='box '+(st==='clear'?'ok':st==='unchecked'?'unk':'');
    b.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.width}px;height:${r.height}px`;
    ovl.appendChild(b);
    const m=document.createElement('button');
    m.className='mk '+(st==='clear'?'ok':st==='unchecked'?'unk':(c.sev===2?'maj':'gap'))+(selected===c.id?' sel':'');
    m.style.cssText=`left:${r.left}px;top:${r.top}px`;
    m.innerHTML=`<span class="dot">${i+1}</span>`;
    m.title=L(c.nm); m.onclick=()=>selectCheck(c.id,false);
    ovl.appendChild(m);
  });
  notes.filter(n=>n.sample===sampleKey).forEach(n=>{
    const el=d.querySelector(n.sel); if(!el) return;
    const r=el.getBoundingClientRect();
    const p=document.createElement('span');
    p.className='pin'; p.style.cssText=`left:${r.left+r.width-8}px;top:${r.top+6}px`;
    p.innerHTML=ICON[n.kind==='cap'?'capture':'pin'].replace('class="ic"','class="ic sm"');
    ovl.appendChild(p);
  });
}

/* ── checks ── */
function renderChecks(){
  const wrap=document.getElementById('checks');
  wrap.innerHTML=CHECKS.map((c,i)=>{
    const a=applicable(c), st=effState(c);
    const bars=[1,2,3].map(n=>`<i class="${c.sev>=n&&st!=='na'?'f '+(c.sev===2?'m':''):''}"></i>`).join('');
    return `<div class="chk ${st==='na'?'na':''} ${selected===c.id?'sel open':''}" data-id="${c.id}">
      <button class="chk-h"><span class="num">${i+1}</span>
        <span class="stx"><span class="nm">${L(c.nm)}</span><br><span class="en">${c.en}${a==='alt'?t('altDiff'):a==='na'?t('naTag'):''}</span></span>
        <span class="rt"><span class="${STATE_CLS[st]}">${ICON[STATE_IC[st]].replace('class="ic"','class="ic sm"')}</span>
        <span class="sevbar">${bars}</span></span></button>
      <div class="chk-b">
        ${a==='alt'&&c.alt?`<div class="alt"><div class="lb">${L(CARRIERS[carrier].label)} ${t('altAdj')}</div>${L(c.alt)}</div>`:''}
        <div class="fld"><div class="lb">${t('claim')}</div><div class="verb claim">${L(c.claim)}</div></div>
        <div class="fld"><div class="lb">${t('obs')}</div><div class="vl">${L(c.obs)}</div></div>
        <div class="fld"><div class="lb">${t('why')}</div><div class="vl">${L(c.why)}</div></div>
        <div class="fld"><div class="lb">${t('fix')}</div><div class="vl">${L(c.fix)}</div></div>
        <button class="jump" data-j="${c.id}">${ICON.pin.replace('class="ic"','class="ic sm"')}${t('jump')}</button>
      </div></div>`;
  }).join('');
  wrap.querySelectorAll('.chk-h').forEach(b=>b.onclick=()=>selectCheck(b.parentElement.dataset.id,true));
  wrap.querySelectorAll('.jump').forEach(b=>b.onclick=e=>{e.stopPropagation();selectCheck(b.dataset.j,true);});
  const act=CHECKS.filter(c=>applicable(c)!=='na');
  const gaps=act.filter(c=>c.state==='gap').length;
  document.getElementById('chkCnt').textContent=t('chkCnt')(gaps,act.length);
}
function selectCheck(id,scroll){
  const c=CHECKS.find(x=>x.id===id); if(!c) return;
  selected=id;
  if(c.sample!==sampleKey){ sampleKey=c.sample; sel.value=c.sample; loadSample(); }
  renderChecks(); buildEvidence();
  setTimeout(()=>{
    try{ const el=fr.contentDocument.querySelector(c.sel);
      el&&el.scrollIntoView({behavior:'smooth',block:'center'}); }catch(e){}
    setTimeout(drawMarkers,320);
  },scroll?180:0);
  const row=document.querySelector(`.chk[data-id="${id}"]`);
  row&&row.scrollIntoView({block:'nearest'});
}

/* ── notes ── */
function renderNotes(){
  const el=document.getElementById('notes');
  if(!notes.length){ el.innerHTML=`<div class="empty">${t('notesEmpty')}</div>`; return; }
  el.innerHTML=notes.map((n,i)=>`<div class="note">
    <div class="nh">${ICON[n.kind==='cap'?'capture':'pen'].replace('class="ic"','class="ic sm"')}
      <span>${n.route}</span><button data-d="${i}">${ICON.trash.replace('class="ic"','class="ic sm"')}</button></div>
    <div class="nsel">${n.sel}</div>
    ${n.verbatim?`<div class="ntx">「${n.verbatim}」</div>`:''}
    ${n.text?`<div class="ntx">${n.text}</div>`:''}</div>`).join('');
  el.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{notes.splice(+b.dataset.d,1);renderNotes();renderSteps();drawMarkers();buildEvidence();});
}

/* ── evidence ── */
function buildEvidence(){
  const act=CHECKS.filter(c=>applicable(c)!=='na');
  const c=CHECKS.find(x=>x.id===selected);
  const rec={
    schema:'ral/0.1', method:'interface-evidence/v1',
    surface_under_test:{ product:t('product'), carrier:carrier,
      viewport:`${CARRIERS[carrier].w}x${CARRIERS[carrier].h}`, route:SAMPLES[sampleKey]?.route||mode },
    audited_at:'2026-08-29T09:00Z', enforcement:'monitor',
    checks: act.map(x=>({id:x.id, name:x.en, state:x.state,
      severity:x.sev===3?'critical':x.sev===2?'major':null,
      anchor:{route:SAMPLES[x.sample].route, selector:x.sel},
      carrier_rule:x.carriers[carrier]})),
    summary:{ applicable:act.length, gaps:act.filter(x=>x.state==='gap').length,
      unchecked:act.filter(x=>x.state==='unchecked').length,
      clear:act.filter(x=>x.state==='clear').length },
    annotations: notes.map(n=>({kind:n.kind,route:n.route,selector:n.sel,verbatim:n.verbatim})),
    focus: c?c.id:null,
    note:t('eviNote')
  };
  document.getElementById('eviBody').innerHTML =
    JSON.stringify(rec,null,2).replace(/"(gap|unchecked|critical|major)"/g,'<b>"$1"</b>');
  document.getElementById('copyEvi').onclick=e=>{
    navigator.clipboard&&navigator.clipboard.writeText(JSON.stringify(rec,null,2));
    const s=e.currentTarget; s.lastChild.textContent=t('copied');
    setTimeout(()=>s.lastChild.textContent=t('copy'),1400);
  };
}

/* ── modes ── */
const inAddr=document.getElementById('inAddr'), inFile=document.getElementById('inFile');
document.querySelectorAll('.addr .mbtn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.addr .mbtn').forEach(x=>x.classList.remove('on'));
  b.classList.add('on'); mode=b.dataset.m;
  sel.hidden = mode!=='sample'; inAddr.hidden = mode==='sample'||mode==='file';
  if(mode==='url') inAddr.placeholder=t('phUrl');
  if(mode==='repo') inAddr.placeholder=t('phRepo');
  if(mode==='file') inFile.click();
  if(mode==='sample') loadSample();
});
function blocked(title,body){
  ovl.innerHTML=''; fr.removeAttribute('srcdoc');
  fr.srcdoc=`<div style="font:13px/1.7 -apple-system,'PingFang TC',sans-serif;padding:40px;color:#57534d;text-align:center">
    <div style="font-weight:600;color:#1a1a18;margin-bottom:6px">${title}</div><div style="font-size:12px">${body}</div></div>`;
}
document.getElementById('goBtn').onclick=async()=>{
  const v=inAddr.value.trim();
  if(mode==='sample'){ loadSample(); return; }
  if(mode==='url'){
    if(!v) return;
    fr.removeAttribute('srcdoc'); fr.src=v; ovl.innerHTML='';
    setTimeout(()=>{ let ok=false; try{ ok=!!fr.contentDocument }catch(e){ ok=false }
      if(!ok) blocked(t('blkXtitle'), t('blkXbody')); },1400);
    return;
  }
  if(mode==='repo'){
    if(!v) return;
    const raw = v.startsWith('http') ? v :
      'https://raw.githubusercontent.com/'+v.replace(/^\/+/,'').replace(/\/blob\//,'/');
    blocked(t('blkRead'), raw);
    try{
      const r=await fetch(raw); if(!r.ok) throw new Error('HTTP '+r.status);
      let t=await r.text();
      const base=raw.replace(/\/[^/]*$/,'/');
      t=t.replace(/(src|href)=["'](?!https?:|data:|#|\/\/)([^"']+)["']/g,(m,a,p)=>`${a}="${base}${p.replace(/^\.\//,'')}"`);
      fr.removeAttribute('src'); fr.srcdoc=t; fr.onload=()=>{hookFrame();drawMarkers();};
    }catch(e){
      blocked(t('blkFail'), t('blkFailBody')(e.message));
    }
    return;
  }
};
inAddr.addEventListener('keydown',e=>{ if(e.key==='Enter') document.getElementById('goBtn').click(); });
inFile.onchange=async()=>{
  const f=inFile.files[0]; if(!f) return;
  const t=await f.text();
  if(/\.(md|mdx)$/i.test(f.name)){
    const body=t.replace(/^---[\s\S]*?---/,'')
      .replace(/^### (.*)$/gm,'<h3>$1</h3>').replace(/^## (.*)$/gm,'<h2>$1</h2>')
      .replace(/^# (.*)$/gm,'<h1>$1</h1>').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>')
      .replace(/^- (.*)$/gm,'<li>$1</li>').replace(/\n{2,}/g,'</p><p>');
    fr.removeAttribute('src');
    fr.srcdoc=`<div style="font:14px/1.75 -apple-system,'PingFang TC',sans-serif;padding:28px;max-width:70ch;margin:auto"><p>${body}</p>
      <hr><div style="font-size:11px;color:#8b857b">${t('mdxNote')}</div></div>`;
  } else { fr.removeAttribute('src'); fr.srcdoc=t; }
  fr.onload=()=>{hookFrame();drawMarkers();};
};

/* ── tools / misc ── */
function setTool(t){ tool = tool===t?null:t;
  document.getElementById('tCap').classList.toggle('on',tool==='cap');
  document.getElementById('tAnn').classList.toggle('on',tool==='ann'); }
document.getElementById('tCap').onclick=()=>setTool('cap');
document.getElementById('tAnn').onclick=()=>setTool('ann');
document.getElementById('tgLeft').onclick=()=>document.getElementById('app').classList.toggle('lcol');
document.getElementById('tgTheme').onclick=()=>{
  const r=document.documentElement;
  const cur=r.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  r.setAttribute('data-theme',cur==='dark'?'light':'dark'); setTimeout(drawMarkers,60);
};
document.getElementById('reload').onclick=()=>{ if(mode==='sample') loadSample(); };
const inp=document.getElementById('inp');
inp.addEventListener('input',()=>{inp.style.height='auto';inp.style.height=inp.scrollHeight+'px';});
document.getElementById('send').onclick=()=>{
  const v=inp.value.trim(); if(!v) return;
  notes.push({kind:'ann',sample:sampleKey,route:SAMPLES[sampleKey].route,sel:'(session note)',verbatim:'',text:v});
  inp.value=''; inp.style.height='auto'; renderNotes(); renderSteps(); buildEvidence();
};
addEventListener('resize',()=>{applyCarrier()});

function applyChrome(){
  document.title = t('title');
  document.documentElement.lang = LANGTAG[lang];
  document.querySelectorAll('[data-t]').forEach(el=>{
    const val = I18N[lang][el.getAttribute('data-t')];
    if(val != null && typeof val === 'string') el.innerHTML = val;
  });
  document.querySelectorAll('[data-t-title]').forEach(el=>{
    el.title = t(el.getAttribute('data-t-title'));
  });
  document.querySelectorAll('[data-t-ph]').forEach(el=>{
    el.placeholder = t(el.getAttribute('data-t-ph'));
  });
  document.querySelectorAll('.lang-switch button').forEach(b=>{
    b.classList.toggle('active', b.getAttribute('data-lang')===lang);
  });
}

function setLang(next){
  lang = next === 'zh' ? 'zh' : 'en';
  try { localStorage.setItem('auditLang', lang); } catch(e){}
  applyChrome();
  fillSampleSel();
  renderLegend(); renderSteps(); renderCarriers(); renderNotes(); renderChecks();
  if(mode==='sample') loadSample();
  applyCarrier(); buildEvidence();
  if(selected) setTimeout(()=>selectCheck(selected,false),220);
}

document.querySelector('.lang-switch').addEventListener('click', e=>{
  const b = e.target.closest('button[data-lang]');
  if(b) setLang(b.getAttribute('data-lang'));
});

/* ── boot ── */
applyChrome();
renderLegend(); renderSteps(); renderCarriers(); renderNotes(); renderChecks();
loadSample(); applyCarrier(); buildEvidence();
setTimeout(()=>selectCheck('C3',true),500);
</script>
</div>
</div>
